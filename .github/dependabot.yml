version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      commitlint:
        patterns:
          - '*'
